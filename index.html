<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Birthday Surprise</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  background: black;
}
#stage {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
}
/* ---------------- NIGHT SKY ---------------- */
#nightSky {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(#0b0b33, #000010);
  animation: fadeOut 7s forwards;
}
@keyframes fadeOut {
  0% { opacity: 1; }
  100% { opacity: 0; }
}
.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  opacity: 0.7;
  animation: twinkle 2s infinite ease-in-out;
}
@keyframes twinkle {
  0%,100% { opacity: 0.2; }
  50% { opacity: 1; }
}
#moon {
  position: absolute;
  top: 18%;
  right: 12%;
  width: 140px;
  height: 140px;
  background: radial-gradient(circle, #fff, #d9d9d9, #bfbfbf);
  border-radius: 50%;
  box-shadow: 0 0 35px #ffffff90;
}
/* --------------- DAY SKY ------------------ */
#daySky {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(#87ceeb, #fffad1);
  opacity: 0;
  animation: fadeIn 9s forwards;
  animation-delay: 7s;
}
@keyframes fadeIn {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
#sun {
  position: absolute;
  top: 18%;
  left: 10%;
  width: 160px;
  height: 160px;
  background: radial-gradient(circle, #fff78d, #ffcc00, #ff9900);
  border-radius: 50%;
  box-shadow: 0 0 40px #ffe066;
}
/* ---------------- FINAL PAGE ---------------- */
#finalPage {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  animation: finalShow 7s forwards;
  animation-delay: 16s;
}
@keyframes finalShow {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
#cross {
  width: 200px;
  filter: drop-shadow(0 0 15px white);
}
#name {
  margin-top: 10px;
  font-size: 55px;
  font-family: 'Great Vibes', cursive;
  color: gold;
  text-shadow: 0 0 15px gold;
  animation: glowName 3s infinite alternate;
}
@keyframes glowName {
  0% { text-shadow: 0 0 10px gold; }
  100% { text-shadow: 0 0 25px gold; }
}
/* ---------------- BUTTERFLIES ---------------- */
.butterfly {
  position: absolute;
  width: 50px;
  animation: flyAway 6s linear forwards;
}
@keyframes flyAway {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(-200px,-400px) scale(0.2); opacity: 0; }
}
/* ---------------- PETALS ---------------- */
.petal {
  position: absolute;
  width: 35px;
  height: 35px;
  background-image: url('https://i.imgur.com/8eQXK0R.png');
  background-size: cover;
  opacity: 0.9;
  animation: fall 7s linear infinite;
}
@keyframes fall {
  from { transform: translateY(-10px) rotate(0deg); }
  to { transform: translateY(120vh) rotate(360deg); }
}
/* --------------- BUTTON ---------------- */
#surpriseBtn {
  margin-top: 20px;
  padding: 14px 30px;
  border: none;
  font-size: 22px;
  border-radius: 10px;
  background: gold;
  color: black;
  font-weight: bold;
  cursor: pointer;
}
#versePage {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  padding: 40px;
  font-size: 30px;
  font-family: 'Merriweather', serif;
  color: black;
  background: #fff5da;
  text-align: center;
}
</style>
</head>
<body>
<div id="stage">
  <div id="nightSky">
    <div id="moon"></div>
  </div>

  <div id="daySky">
    <div id="sun"></div>
  </div>

  <div id="finalPage">
    <img id="cross" src="https://i.imgur.com/fH7y1tK.png" />
    <div id="name">Farha Madam</div>
    <button id="surpriseBtn" onclick="showVerse()">Tap for Surprise</button>
  </div>

  <div id="versePage">
    “Charm is deceptive, and beauty is fleeting; but a woman who fears the Lord is to be praised.” – Proverbs 31:30
  </div>
</div>

<script>
/* ---- STARS ---- */
for (let i = 0; i < 120; i++) {
  let star = document.createElement('div');
  star.className = 'star';
  star.style.top = Math.random()*100 + '%';
  star.style.left = Math.random()*100 + '%';
  document.getElementById('nightSky').appendChild(star);
}

/* ---- BUTTERFLIES AFTER NAME ---- */
setTimeout(() => {
  for (let i = 0; i < 10; i++) {
    let b = document.createElement('img');
    b.className = 'butterfly';
    b.src = 'https://i.imgur.com/7yZ9E7N.png';
    b.style.left = (50 + Math.random()*10) + 'vw';
    b.style.top = (50 + Math.random()*5) + 'vh';
    b.style.animationDelay = (i * 0.3) + 's';
    document.body.appendChild(b);
  }
}, 16500);

/* ---- PETALS CONTINUOUS ---- */
for (let i = 0; i < 20; i++) {
  let petal = document.createElement('div');
  petal.className = 'petal';
  petal.style.left = Math.random()*100 + 'vw';
  petal.style.animationDelay = Math.random()*7 + 's';
  document.body.appendChild(petal);
}

/* ---- SHOW VERSE ---- */
function showVerse() {
  document.getElementById('finalPage').style.display = 'none';
  document.getElementById('versePage').style.display = 'block';
}
</script>
</body>
</html>
