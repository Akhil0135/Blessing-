<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rachael — Birthday Surprise (Gold)</title>
<style>
  :root{
    --gold:#D9A94B;
    --gold-deep:#b98b2e;
    --cream:#FFF7EB;
    --bg-night:#07071a;
    --bg-day:#fff6e8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;overflow:hidden;background:var(--bg-night);}

  /* layout */
  .stage{position:relative;width:100vw;height:100vh;overflow:hidden}

  /* night */
  #night{position:absolute;inset:0;background:radial-gradient(circle at 20% 20%, #0b1633 0%, #03030a 60%);z-index:10;transition:opacity 1s ease}
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:linear-gradient(#fff9d9,#fff);filter:drop-shadow(0 0 6px rgba(255,220,120,0.6));opacity:0;animation:tw 2.4s infinite linear}
  @keyframes tw{0%{opacity:0.1}50%{opacity:1}100%{opacity:0.1}}
  /* moon (SVG circle) */
  .moon{position:absolute;right:4vw;top:6vh;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#fff7d6,#f0dfb3);box-shadow:0 0 30px rgba(217,169,75,0.25);z-index:12}

  /* day */
  #day{position:absolute;inset:0;background:linear-gradient(180deg,#fff7eb,#fff0d8);opacity:0;z-index:9;transition:opacity 1s ease}
  .sun{position:absolute;left:5vw;top:6vh;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#fff2a6,#ffd24d);box-shadow:0 0 40px rgba(255,210,120,0.6)}

  /* final */
  #final{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gold-deep);background:linear-gradient(180deg,rgba(0,0,0,0.02),rgba(255,250,240,0));opacity:0;z-index:11;transition:opacity 1s ease}

  /* cross (inline SVG container) */
  .cross{width:120px;height:120px;display:block}
  .name{font-family:'Great Vibes',cursive;font-size:clamp(36px,7vw,84px);color:var(--gold);text-shadow:0 6px 24px rgba(217,169,75,0.35);margin-top:18px;opacity:0;transform:translateY(6px);transition:all 0.8s ease}

  /* buttons */
  .controls{margin-top:18px}
  .btn{padding:12px 20px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
  .btn-surprise{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#2b1a08}
  .btn-verse{background:white;color:var(--gold-deep);box-shadow:0 6px 18px rgba(0,0,0,0.12)}

  /* petals and butterflies - use data-uri SVG as background for reliability */
  .petal{position:absolute;width:28px;height:28px;background-size:contain;background-repeat:no-repeat;pointer-events:none;z-index:8}
  .butterfly{position:absolute;width:56px;height:56px;background-size:contain;background-repeat:no-repeat;pointer-events:none;z-index:13}

  /* poetic text block */
  .poem{margin-top:18px;font-size:20px;color:#3b2b12;max-width:86vw;line-height:1.4;opacity:0;transform:translateY(6px);transition:all .7s ease}

  /* verse container */
  .verse{margin-top:14px;font-size:20px;color:#3b2b12;max-width:88vw;line-height:1.5;display:none}

  /* responsive tweaks */
  @media (max-width:520px){.name{font-size:36px}.butterfly{width:44px;height:44px}.moon{width:90px;height:90px}.sun{width:110px;height:110px}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="night">
    <div class="moon" aria-hidden="true"></div>
  </div>
  <div id="day">
    <div class="sun" aria-hidden="true"></div>
  </div>
  <div id="final">
    <!-- inline SVG cross (gold) -->
    <svg class="cross" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#FFF3C6"/><stop offset="1" stop-color="#D9A94B"/></linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g fill="url(#g1)" filter="url(#glow)">
        <path d="M48 6h4v36h36v4H52v36h-4V46H12v-4h36z" />
      </g>
    </svg>

    <div class="name" id="name">Rachael</div>

    <div class="controls" id="controls">
      <button class="btn btn-surprise" id="surpriseBtn">Tap for Surprise</button>
    </div>

    <div class="poem" id="poem" aria-live="polite"></div>
    <div class="verse" id="verse">"Charm is deceptive, and beauty is fleeting; but a woman who fears the Lord is to be praised." — <strong>Proverbs 31:30</strong></div>
  </div>
</div>

<script>
// NOTE: timings: night 7s, day 9s, final 7s (start times calculated accordingly)
const nightDuration = 7000;
const dayDuration = 9000; // after night
const finalDelay = nightDuration + dayDuration; // when final should appear

// Create stars (night)
const night = document.getElementById('night');
for(let i=0;i<90;i++){
  const s = document.createElement('div');
  s.className='star';
  s.style.left = Math.random()*100 + 'vw';
  s.style.top = Math.random()*100 + 'vh';
  s.style.animationDelay = Math.random()*2 + 's';
  night.appendChild(s);
}

// Data URIs for petals & butterflies (gold theme simple SVGs)
const petalSVG = encodeURIComponent(`
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'>
  <path d='M12 2c4 3 8 7 6 11s-7 3-10 0c-3-3 0-8 4-11z' fill='%23FFD9B3' stroke='%23E6B87A'/> 
</svg>`);
const butterflySVG = encodeURIComponent(`
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>
  <g>
    <path d='M8 24c6-8 18-8 18-8s2 8-4 14S4 30 8 24z' fill='%23EBC07A' stroke='%23C89B45'/> 
    <path d='M56 24c-6-8-18-8-18-8s-2 8 4 14 22-2 14-6z' fill='%23F6D88F' stroke='%23C89B45'/> 
    <ellipse cx='32' cy='34' rx='4' ry='6' fill='%23C07A2A'/>
  </g>
</svg>`);

// helper to spawn petals
function spawnPetal(){
  const el = document.createElement('div');
  el.className='petal';
  el.style.left = Math.random()*100 + 'vw';
  el.style.top = -40 + 'px';
  el.style.backgroundImage = `url("data:image/svg+xml;utf8,${petalSVG}")`;
  el.style.opacity = 0.95;
  el.style.transition = 'transform 7s linear, opacity 7s linear';
  document.body.appendChild(el);
  // animate via transform
  requestAnimationFrame(()=>{
    el.style.transform = `translateY(${window.innerHeight + 80}px) rotate(${Math.random()*720}deg)`;
  });
  setTimeout(()=>el.remove(), 8000);
}

// spawn petals continuously but moderate rate
let petalInterval = setInterval(spawnPetal, 600);

// helper to spawn butterflies from name area revealing letters
function spawnButterfly(fromX, fromY, delay=0){
  const el = document.createElement('div');
  el.className = 'butterfly';
  el.style.left = fromX + 'px';
  el.style.top = fromY + 'px';
  el.style.backgroundImage = `url("data:image/svg+xml;utf8,${butterflySVG}")`;
  el.style.opacity = 1;
  document.body.appendChild(el);
  // choose random target
  const tx = (Math.random()>0.5 ? -1 : 1) * (100 + Math.random()*220);
  const ty = -(200 + Math.random()*260);
  el.style.transition = `transform ${4 + Math.random()*2}s cubic-bezier(.2,.8,.2,1), opacity 1s linear ${4 + Math.random()*2}s`;
  setTimeout(()=>{
    el.style.transform = `translate(${tx}px, ${ty}px) scale(0.4)`;
    el.style.opacity = 0;
    setTimeout(()=>el.remove(), 7000);
  }, delay);
}

// timeline: show day after nightDuration
setTimeout(()=>{
  document.getElementById('day').style.opacity = 1;
}, nightDuration);

// show final after night+day
setTimeout(()=>{
  document.getElementById('final').style.opacity = 1;
  // reveal name gently
  setTimeout(()=>{
    const name = document.getElementById('name');
    name.style.opacity = 1;
    name.style.transform = 'translateY(0)';
  }, 1200);
}, finalDelay);

// Surprise button flow: when clicked show poetic stanza then 'Verse for You' button
const surpriseBtn = document.getElementById('surpriseBtn');
const poemEl = document.getElementById('poem');
const controls = document.getElementById('controls');
const verseEl = document.getElementById('verse');

surpriseBtn.addEventListener('click', ()=>{
  // hide surprise button
  surpriseBtn.style.display = 'none';
  // stop spawning petals shortly to focus
  clearInterval(petalInterval);
  // poetic lines with rhyme (gold theme tone)
  const stanza = [
    'A golden dawn, your smile aglow,',
    'Like sunlit rivers, soft and slow.',
    'Petals dance where footsteps stray,',
    'Rachael, you turn night into day.'
  ];
  poemEl.innerHTML = stanza.map(line => `<div>${line}</div>`).join('');
  poemEl.style.opacity = 1;
  poemEl.style.transform = 'translateY(0)';
  // spawn gentle butterflies from name for reveal effect
  const nameRect = document.getElementById('name').getBoundingClientRect();
  for(let i=0;i<8;i++) spawnButterfly(nameRect.left + nameRect.width/2, nameRect.top + 10, i*180);
  // after poem appears, show Verse button
  setTimeout(()=>{
    const vbtn = document.createElement('button');
    vbtn.className = 'btn btn-verse';
    vbtn.textContent = 'Verse for You';
    vbtn.onclick = showVerse;
    controls.appendChild(vbtn);
  }, 1800);
});

function showVerse(){
  // hide poem and controls, show verse
  poemEl.style.display = 'none';
  controls.style.display = 'none';
  verseEl.style.display = 'block';
}

// small accessibility: allow tapping final area to also spawn butterflies
document.getElementById('final').addEventListener('click', (e)=>{
  // if clicked on blank area after final visible, spawn a small burst
  if(document.getElementById('final').style.opacity < 0.9) return;
  const r = document.getElementById('name').getBoundingClientRect();
  for(let i=0;i<4;i++) spawnButterfly(r.left + r.width/2 + (Math.random()-0.5)*80, r.top + 10 + (Math.random()-0.5)*40, i*120);
});

</script>
</body>
</html>
