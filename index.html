<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Birthday Surprise</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { overflow:hidden; font-family: 'Poppins', sans-serif; background:black; }

/* ---------------- NIGHT SKY ---------------- */
#nightSky {
  width:100vw;
  height:100vh;
  position:absolute;
  top:0; left:0;
  background: radial-gradient(#05051a, #000);
  animation: fadeOut 7s forwards;
  z-index:1;
}
@keyframes fadeOut { 0%{opacity:1;} 100%{opacity:0;} }
.star {
  position:absolute;
  width:2px; height:2px;
  background:white;
  border-radius:50%;
  animation: twinkle 2s infinite ease-in-out;
}
@keyframes twinkle { 0%,100%{opacity:0.2;} 50%{opacity:1;} }
#moon {
  position:absolute;
  top:20%; left:70%;
  width:140px; height:140px;
  background: radial-gradient(#fff, #dcdcdc);
  border-radius:50%;
  box-shadow:0 0 30px #fff;
}

/* ---------------- DAY SKY ---------------- */
#daySky {
  width:100vw;
  height:100vh;
  position:absolute;
  top:0; left:0;
  background: linear-gradient(#79c8ff, #fff6d4);
  opacity:0;
  animation: fadeIn 9s forwards;
  animation-delay:7s;
  z-index:2;
}
@keyframes fadeIn { 0%{opacity:0;} 100%{opacity:1;} }
#sun {
  position:absolute;
  top:20%; left:20%;
  width:160px; height:160px;
  background: radial-gradient(#fff48b, #ffb700);
  border-radius:50%;
  box-shadow:0 0 40px #ffe580;
}

/* ---------------- FINAL PHASE ---------------- */
#finalPage {
  position:absolute;
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  opacity:0;
  animation: finalFade 7s forwards;
  animation-delay:16s;
  z-index:3;
}
@keyframes finalFade { 0%{opacity:0;} 100%{opacity:1;} }
#cross {
  width:190px;
  filter:drop-shadow(0 0 12px #fff);
}

/* ---------------- NAME REVEAL ---------------- */
#nameReveal {
  margin-top:20px;
  font-size:48px;
  font-family: 'Great Vibes', cursive;
  color:gold;
  letter-spacing:18px;
  opacity:0;
  animation: revealName 4s forwards;
  animation-delay:18s;
  text-shadow:0 0 10px gold;
}
@keyframes revealName {
  0% { opacity:0; letter-spacing:25px; filter:blur(6px); }
  100% { opacity:1; letter-spacing:3px; filter:blur(0); }
}

/* ---------------- BUTTERFLIES ---------------- */
.butterfly {
  position:absolute;
  width:50px;
  animation: flyUp 5s ease-out forwards;
}
@keyframes flyUp {
  from { transform:translateY(0) scale(1); opacity:1; }
  to { transform:translateY(-300px) scale(0.5); opacity:0; }
}

/* ---------------- ROSE PETALS ---------------- */
.petal {
  position:absolute;
  width:28px; height:28px;
  background-image:url('https://i.imgur.com/8eQXK0R.png');
  background-size:cover;
  opacity:0.9;
  animation: fall 6s linear infinite;
}
@keyframes fall {
  from { transform:translateY(-10px) rotate(0deg); }
  to { transform:translateY(120vh) rotate(360deg); }
}

/* ---------------- BUTTON ---------------- */
#tapBtn {
  margin-top:25px;
  padding:12px 24px;
  background:gold;
  color:black;
  border-radius:8px;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}
#versePage {
  position:absolute;
  top:0; left:0;
  width:100vw; height:100vh;
  background:white;
  display:none;
  justify-content:center;
  align-items:center;
  padding:40px;
  font-size:30px;
  font-family:'Merriweather', serif;
  line-height:1.5;
  color:#333;
  z-index:5;
}
</style>
</head>
<body>

<div id="nightSky">
  <div id="moon"></div>
</div>

<div id="daySky">
  <div id="sun"></div>
</div>

<div id="finalPage">
  <img id="cross" src="https://i.imgur.com/fH7y1tK.png" />
  <div id="nameReveal">Farha Madam</div>
  <button id="tapBtn" onclick="showVerse()">Tap for Surprise</button>
</div>

<div id="versePage">
  “Charm is deceptive, and beauty is fleeting; but a woman who fears the Lord is to be praised.” – Proverbs 31:30
</div>

<script>
/* -------- STARS -------- */
for (let i = 0; i < 90; i++) {
  let star = document.createElement('div');
  star.classList.add('star');
  star.style.top = Math.random()*100+'%';
  star.style.left = Math.random()*100+'%';
  document.getElementById('nightSky').appendChild(star);
}

/* -------- BUTTERFLIES AFTER NAME -------- */
setTimeout(() => {
  for (let i=0; i<7; i++) {
    let b = document.createElement('img');
    b.src = 'https://i.imgur.com/7yZ9E7N.png';
    b.className = 'butterfly';
    b.style.left = (45 + Math.random()*10) + 'vw';
    b.style.bottom = '20vh';
    b.style.animationDelay = i*0.3 + 's';
    document.body.appendChild(b);
  }
}, 18500);

/* -------- ROSE PETALS -------- */
setInterval(() => {
  let petal = document.createElement('div');
  petal.className = 'petal';
  petal.style.left = Math.random()*100 + 'vw';
  petal.style.animationDuration = 4 + Math.random()*3 + 's';
  document.body.appendChild(petal);
  setTimeout(() => petal.remove(), 7000);
}, 300);

/* -------- SHOW VERSE PAGE -------- */
function showVerse(){
  document.getElementById('finalPage').style.display='none';
  document.getElementById('versePage').style.display='flex';
}
</script>

</body>
</html>
